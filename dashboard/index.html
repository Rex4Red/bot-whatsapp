<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Bot Dashboard</title>
  <meta name="description" content="Dashboard monitoring untuk WhatsApp Bot Notification System" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <div>
        <h1>WA Bot Dashboard</h1>
        <p class="header-subtitle">Notification System</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text">Checking...</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Stats Cards -->
    <section class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon sent">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statSent">0</span>
          <span class="stat-label">Terkirim</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon failed">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statFailed">0</span>
          <span class="stat-label">Gagal</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon today">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statToday">0</span>
          <span class="stat-label">Hari Ini</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon total">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total Pesan</span>
        </div>
      </div>
    </section>

    <!-- Content Grid -->
    <div class="content-grid">
      <!-- Left Column -->
      <div class="left-column">
        <!-- QR Code Section -->
        <section class="card qr-section" id="qrSection">
          <div class="card-header">
            <h2>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="14" y1="21" x2="21" y2="21"/></svg>
              QR Code
            </h2>
          </div>
          <div class="card-body qr-body">
            <div class="qr-container" id="qrContainer">
              <div class="qr-placeholder">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <p id="qrMessage">Menunggu koneksi...</p>
              </div>
            </div>
            <div class="qr-actions">
              <button class="btn btn-outline" id="btnRestart" onclick="restartClient()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Restart
              </button>
              <button class="btn btn-danger-outline" id="btnLogout" onclick="logoutClient()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
              </button>
            </div>
          </div>
        </section>

        <!-- Send Message Section -->
        <section class="card">
          <div class="card-header">
            <h2>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Kirim Pesan
            </h2>
            <div class="tab-group">
              <button class="tab active" onclick="switchTab('single', this)">Single</button>
              <button class="tab" onclick="switchTab('broadcast', this)">Broadcast</button>
            </div>
          </div>
          <div class="card-body">
            <!-- Single Message Form -->
            <form id="singleForm" onsubmit="sendSingle(event)">
              <div class="form-group">
                <label for="singlePhone">Nomor WhatsApp</label>
                <input type="text" id="singlePhone" placeholder="628xxxxxxxxxx" required />
              </div>
              <div class="form-group">
                <label for="singleMessage">Pesan</label>
                <textarea id="singleMessage" rows="3" placeholder="Tulis pesan..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-full" id="btnSendSingle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Kirim Pesan
              </button>
            </form>

            <!-- Broadcast Form -->
            <form id="broadcastForm" class="hidden" onsubmit="sendBroadcast(event)">
              <div class="form-group">
                <label for="broadcastPhones">Nomor WhatsApp (satu per baris)</label>
                <textarea id="broadcastPhones" rows="4" placeholder="628xxxxxxxxxx&#10;628xxxxxxxxxx&#10;628xxxxxxxxxx" required></textarea>
              </div>
              <div class="form-group">
                <label for="broadcastMessage">Pesan</label>
                <textarea id="broadcastMessage" rows="3" placeholder="Tulis pesan broadcast..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-full" id="btnSendBroadcast">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Broadcast Pesan
              </button>
            </form>
          </div>
        </section>

        <!-- Contacts Section -->
        <section class="card">
          <div class="card-header">
            <h2>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Kontak
            </h2>
            <button class="btn btn-sm btn-outline" onclick="toggleAddContact()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Tambah
            </button>
          </div>
          <div class="card-body">
            <!-- Add Contact Form (hidden by default) -->
            <form id="addContactForm" class="hidden" onsubmit="addContact(event)">
              <div class="form-row">
                <div class="form-group">
                  <input type="text" id="contactName" placeholder="Nama" required />
                </div>
                <div class="form-group">
                  <input type="text" id="contactPhone" placeholder="628xxx" required />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <input type="text" id="contactGroup" placeholder="Grup (opsional)" />
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Simpan</button>
              </div>
            </form>
            <div class="contact-list" id="contactList">
              <div class="empty-state small">Belum ada kontak</div>
            </div>
          </div>
        </section>
      </div>

      <!-- Right Column: Message Logs -->
      <div class="right-column">
        <section class="card logs-section">
          <div class="card-header">
            <h2>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Message Logs
            </h2>
            <div class="log-filters">
              <select id="logFilter" onchange="loadLogs()">
                <option value="">Semua</option>
                <option value="sent">Terkirim</option>
                <option value="failed">Gagal</option>
                <option value="pending">Pending</option>
              </select>
              <button class="btn btn-sm btn-outline" onclick="loadLogs()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
          </div>
          <div class="card-body logs-body">
            <div class="logs-table-wrap">
              <table class="logs-table" id="logsTable">
                <thead>
                  <tr>
                    <th>Waktu</th>
                    <th>Nomor</th>
                    <th>Pesan</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="logsBody">
                  <tr><td colspan="4" class="empty-state">Belum ada log pesan</td></tr>
                </tbody>
              </table>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./main.js"></script>
</body>
</html>
